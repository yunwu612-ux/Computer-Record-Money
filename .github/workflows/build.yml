name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet publish src/LocalBookkeeper/LocalBookkeeper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath LocalBookkeeper-PC-V1.0.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalBookkeeper-PC-V1.0
          path: LocalBookkeeper-PC-V1.0.zip
